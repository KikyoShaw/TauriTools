[package]
name = "kikyo-tools"
version = "0.1.0"
description = "Local developer tools for calculations, encoding, colors, JSON and QR codes"
default-run = "KikyoTools"
authors = ["Kikyo"]
edition = "2024"

[[bin]]
name = "KikyoTools"
path = "src/main.rs"

[lib]
name = "kikyo_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
