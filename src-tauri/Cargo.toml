[package]
name = "kikyo-calculator"
version = "0.1.0"
description = "A precise programmer calculator"
authors = ["Kikyo"]
edition = "2024"

[lib]
name = "kikyo_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
